name: FIL CLAIR · Qualité PWA
on:
  push:
    branches:
      - main
      - feat/fil-clair-pwa-safe-v1
    paths:
      - 'pwa/**'
      - 'scripts/test-pwa.mjs'
      - 'scripts/audit-pwa.mjs'
      - 'tests/pwa-core.test.js'
      - '.github/workflows/fil-clair-pwa.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - 'scripts/test-pwa.mjs'
      - 'scripts/audit-pwa.mjs'
      - 'tests/pwa-core.test.js'
      - '.github/workflows/fil-clair-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fil-clair-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pwa-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Installer dépendances verrouillées
        run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Validité de la liste historique
        run: npm run validate:list
      - name: Audit statique PWA
        run: node scripts/audit-pwa.mjs
      - name: Installer Chromium de test
        run: npx playwright install --with-deps chromium
      - name: E2E PWA, sans action sociale réelle
        run: node scripts/test-pwa.mjs
