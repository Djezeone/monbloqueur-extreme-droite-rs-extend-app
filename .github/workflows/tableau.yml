name: Actualiser le tableau des comptes
on:
  push:
    branches: [main]
    paths:
      - liste/accounts.json
      - scripts/update-readme.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tableau-comptes
  cancel-in-progress: false
jobs:
  tableau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/update-readme.mjs
      - name: Enregistrer le tableau
        shell: bash
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Mise à jour du tableau"
          git push
