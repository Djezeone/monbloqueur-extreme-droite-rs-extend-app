name: Vérifier l’extension et la liste
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: extension-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run validate:list
      - run: npm run build:dev
      - run: npm run lint:firefox
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:firefox
# Test logs remain in the job log; no billed artifact/cache storage is created.
