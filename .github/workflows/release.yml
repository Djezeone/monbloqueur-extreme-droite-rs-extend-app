name: Préparer les paquets (publication suspendue)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version des paquets à vérifier localement au job, sans publication"
        type: string
        required: true
        default: "v2.3.0"
permissions:
  contents: read
concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run validate:list
      - run: npm run build
      - run: npm run lint:firefox
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:firefox
      - name: Vérifier les paquets et leurs empreintes sans les publier
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release.mjs --tag "$RELEASE_TAG"
# Manual, read-only preparation only. No cache, uploaded artifact, tag or release.
# Publication requires a separately qualified path after the delivery gates.
