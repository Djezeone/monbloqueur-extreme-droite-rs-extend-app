<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bloquer l’Extrême-droite</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon48.png" width="30" height="30" alt="" />
        <span>Bloquer sur X</span>
      </header>
      <h1>Faites barrage à<br />l’extrême droite.</h1>
      <p class="intro">
        Bloquez les comptes de la liste depuis votre compte X.
      </p>
      <button id="start">Bloquer l’Extrême-droite</button>
      <section
        id="activity"
        class="activity"
        data-state="idle"
        aria-label="Suivi du blocage"
      >
        <div class="activity-top">
          <h2 id="phase" hidden></h2>
          <p id="owner" hidden></p>
        </div>
        <p id="status" role="status" aria-live="polite">
          Chargement de la liste…
        </p>
        <div id="progressInfo" hidden>
          <div class="progress-caption">
            <span id="progressText"></span>
            <span id="progressPercent"></span>
          </div>
          <progress
            id="bar"
            max="1"
            value="0"
            aria-label="Progression du blocage"
          ></progress>
          <p id="currentProfile" class="current-profile" hidden></p>
          <p id="breakdown" class="breakdown" hidden></p>
          <p id="retryHint" class="retry-hint" hidden></p>
        </div>
        <div id="support" class="support" hidden>
          <button id="inspect" class="secondary" hidden>Vérifier X</button>
          <button id="cancel" class="link" hidden>Arrêter</button>
        </div>
      </section>
      <p id="error" role="alert"></p>
      <details>
        <summary><span id="listInfo">Voir la liste</span></summary>
        <ul id="accounts"></ul>
        <div class="list-actions">
          <button id="rescan" class="secondary">Tout revérifier</button>
          <p>
            Si vous avez débloqué un compte sur X, cette option vérifie à
            nouveau toute la liste.
          </p>
        </div>
      </details>
      <footer>
        <span>La liste se met à jour toute seule.</span
        ><a href="privacy.html" target="_blank" rel="noopener"
          >Confidentialité</a
        >
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
