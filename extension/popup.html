<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bloquer l’Extrême-droite</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <img class="icon" src="icons/icon48.png" width="48" height="48" alt="" />
      <h1>Un clic.<br />Une liste bloquée.</h1>
      <p class="intro">Utilise votre compte X déjà connecté.</p>
      <button id="start">Bloquer l’Extrême-droite</button>
      <p id="status" role="status" aria-live="polite">
        Chargement de la liste…
      </p>
      <progress
        id="bar"
        max="1"
        value="0"
        aria-label="Progression du blocage"
        hidden
      ></progress
      ><button id="cancel" class="link" hidden>Arrêter</button>
      <button id="inspect" class="link" hidden>Vérifier X</button>
      <p id="error" role="alert"></p>
      <details>
        <summary id="listInfo">Voir la liste</summary>
        <ul id="accounts"></ul>
      </details>
      <p class="foot">
        La liste s’actualise automatiquement.<br /><a
          href="privacy.html"
          target="_blank"
          rel="noopener"
          >Confidentialité et fonctionnement</a
        >
      </p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
